<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI E-Commerce Test UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>FastAPI E-Commerce Tester</h1>
    <div class="header-actions">
      <button id="btn-show-login">Login</button>
      <button id="btn-show-register">Register</button>
      <button id="btn-show-products">Products</button>
      <button id="btn-show-cart">Cart</button>
    </div>
  </header>

  <main>
    <section id="message" class="message"></section>

    <section id="login-section" class="panel">
      <h2>Login</h2>
      <label>Email<input type="email" id="login-email" placeholder="email@example.com"></label>
      <label>Password<input type="password" id="login-password"></label>
      <button id="btn-login">Login</button>
      <p>Use this to request protected endpoints.</p>
    </section>

    <section id="register-section" class="panel hidden">
      <h2>Register</h2>
      <label>First name<input type="text" id="register-firstname"></label>
      <label>Last name<input type="text" id="register-lastname"></label>
      <label>Username<input type="text" id="register-username"></label>
      <label>Email<input type="email" id="register-email"></label>
      <label>Password<input type="password" id="register-password"></label>
      <button id="btn-register">Register</button>
    </section>

    <section id="products-section" class="panel hidden">
      <h2>Products</h2>
      <div class="inline-row">
        <input type="text" id="search-query" placeholder="Search products...">
        <button id="btn-search">Search</button>
        <button id="btn-refresh-products">Refresh</button>
      </div>
      <div id="products-list" class="list"></div>
      <div class="inline-row">
        <input type="number" id="product-add-id" placeholder="Product ID" min="1">
        <input type="number" id="product-add-qty" placeholder="Quantity" min="1" value="1">
        <button id="btn-add-to-cart">Add to Cart</button>
      </div>
    </section>

    <section id="cart-section" class="panel hidden">
      <h2>Your Cart</h2>
      <div class="inline-row">
        <button id="btn-refresh-cart">Refresh Cart</button>
        <button id="btn-clear-cart">Clear Cart</button>
        <button id="btn-place-order">Place Order</button>
      </div>
      <div id="cart-list" class="list"></div>
    </section>
  </main>

  <footer>
    <p>Open this page from <strong>http://127.0.0.1:8000/</strong> after starting the FastAPI server.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
